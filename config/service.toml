# imagegen service configuration
#
# Relative paths in this file resolve against the directory containing it, so
# `../models` is the models/ directory at the repository root.

[service]
# Loopback by default: nothing outside this machine can reach the GPU unless you
# change it. To listen on every interface, set host = "0.0.0.0" here or launch
# with IMAGEGEN_HOST=0.0.0.0 -- `imagegen serve` takes only --config, there are no
# --host/--port flags. If you expose it, update public_base_url below to match:
# it has no environment override.
host = "127.0.0.1"
port = 8080

# Bearer tokens accepted on /v1/*. An empty list disables authentication, which is
# only safe while the service listens on loopback. Set IMAGEGEN_API_KEYS instead of
# committing real keys.
api_keys = []

# Advertised base URL for response_format="url". Requests for URLs fail with a
# clear 400 when this is unset, because a half-configured URL would be useless.
# There is NO environment override for this key: when you bind to 0.0.0.0, edit it
# to the address clients actually use (LAN IP or hostname), or remote callers get
# a URL pointing back at their own machine.
public_base_url = "http://127.0.0.1:8080"

# A generation on a consumer GPU with CPU-offloaded weights takes minutes, not
# seconds; the synchronous OpenAI endpoint must be allowed to wait that long.
request_timeout_seconds = 1800
max_waiting_requests = 4
blob_ttl_seconds = 3600
blob_capacity = 64

[backends]
sd_server_binary = "../third_party/stable-diffusion.cpp/build/bin/sd-server"
models_dir = "../models"

# on_demand loads a model on its first request and unloads it when idle; eager
# loads every model at startup and restarts a crashed one.
lifecycle = "on_demand"

# Each backend holds ~9 GB of weights plus activations. Two of them do not fit in
# 8 GB of VRAM, so a model switch unloads the other one. Raise this only on a
# machine that genuinely fits more than one.
max_resident_backends = 1

idle_timeout_seconds = 300
start_timeout_seconds = 600
stop_timeout_seconds = 60
offload_to_cpu = true
diffusion_flash_attention = true
log_level = "info"
extra_args = []

# ---------------------------------------------------------------------------
# Models
#
# One [[models]] block per model the service offers. Adding a model is config
# only, provided its weights fit the fields below; a model that needs an engine
# flag no field represents also needs a ModelProfile field in config.py -- see
# AGENTS.md. (The `tokenizer` field was added this way for MOSS-Image, whose
# Qwen3.5 vocabulary is not embedded in sd.cpp.)
#
# Every table is strict: an unknown key is a startup error that names the key,
# never a silent no-op. Weight values are file names inside models_dir, which
# itself resolves against this file's directory. Files must end in .gguf or
# .safetensors. Model ids and ports must be unique, and at least one model is
# required.
#
#   key                      req  default  meaning
#   id                       yes           public id: [a-z0-9][a-z0-9._-]*
#   description              no   ""       shown by `imagegen models`
#   diffusion_model          yes           denoiser (DiT / UNet)
#   vae                      yes           VAE
#   text_encoder             yes           passed to sd-server as --llm
#   vision_encoder           no   none      mmproj vision tower; only VLM-based
#                                           edit presets (qwen) need it
#   tokenizer                no   none      external tokenizer.json for vocab
#                                           not embedded in sd.cpp (MOSS/Qwen3.5)
#   port                     yes           loopback port for this sd-server
#   supports_editing         no   false     offer /v1/images/edits; the vision
#                                           tower is only passed when
#                                           vision_encoder is also set (the
#                                           flux2/flux3 preset needs none: refs
#                                           reach the DiT through the VAE)
#   layout                   no   none      structured-layout dialect this
#                                           checkpoint parses inside the prompt
#                                           (e.g. "moss"); advertised as a
#                                           `layout` key in GET /v1/models and
#                                           omitted entirely when unset
#   default_size             yes           "1024x1024"; used when the client
#                                           omits size, and must itself satisfy
#                                           the two rules below
#   dimension_multiple       no   32        width and height must be multiples
#   max_pixels               yes           ceiling on width * height
#   max_images_per_request   no   1         1..8
#   sampling                 yes           [models.sampling] table, below
#
# Sampling defaults are not cosmetic: the Turbo checkpoint is only correct at 8
# steps, CFG 1 and its own sigma schedule. That schedule is the `sample_sigmas`
# array from Qwen/Qwen-Image-2.1-Turbo/model_index.json with a trailing 0.0, and
# it must not be "corrected" to the base model's behaviour.
#
#   [models.sampling] key    req  default  becomes
#   steps                    yes           --steps
#   cfg                      yes           --cfg-scale
#   sample_method            yes           --sampling-method
#   scheduler                no   none     --scheduler, when set
#   flow_shift               no   none     --flow-shift, when set
#   custom_sigmas            no   []       --sigmas, comma-joined; each in [0,1]
#   negative_prompt          no   ""       sent when the client sends none
#
# After editing, confirm with:
#   uv run imagegen doctor --config config/service.toml
#   uv run imagegen plan --model <id>       # exact sd-server command line
# ---------------------------------------------------------------------------

[[models]]
id = "qwen-image-2.1"
description = "Qwen-Image-2.1, 7B single-stream DiT. Highest quality, 40 steps at CFG 6."
diffusion_model = "qwen_image_2.1-Q4_K.gguf"
vae = "qwen_image_2.1_vae_bf16.safetensors"
text_encoder = "Qwen3VL-8B-Instruct-Q4_K_M.gguf"
vision_encoder = "mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf"
port = 8111
supports_editing = true
vae_tiling = true
default_size = "1024x1024"
dimension_multiple = 32
# Qwen recommends ~2 MP (2048x2048). 1 MP is the practical ceiling on an 8 GB card
# with offloaded weights; raise it together with max_resident_backends on bigger GPUs.
max_pixels = 1048576
max_images_per_request = 1

[models.sampling]
steps = 40
cfg = 6.0
sample_method = "euler"
scheduler = "discrete"
negative_prompt = ""

[[models]]
id = "qwen-image-2.1-turbo"
description = "Qwen-Image-2.1-Turbo, distilled 8-step checkpoint at CFG 1 with a fixed sigma schedule."
diffusion_model = "Qwen-Image-2.1-Turbo-AD-Q4_K.gguf"
vae = "qwen_image_2.1_vae_bf16.safetensors"
text_encoder = "Qwen3VL-8B-Instruct-Q4_K_M.gguf"
vision_encoder = "mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf"
port = 8112
supports_editing = true
vae_tiling = true
default_size = "1024x1024"
dimension_multiple = 32
max_pixels = 1048576
max_images_per_request = 1

[models.sampling]
steps = 8
cfg = 1.0
sample_method = "euler"
custom_sigmas = [1.0, 0.978453, 0.95418, 0.926626, 0.89508, 0.845148, 0.704534, 0.414568, 0.0]
negative_prompt = ""

[[models]]
id = "z-image-turbo"
description = "Z-Image-Turbo, 6B single-stream DiT distilled to 8 steps at CFG 1. ~40% faster than qwen-image-2.1-turbo and Apache-2.0, as is moss-image (see README#license for the full weight-license table). Composes sparse posters well; small lettering is less reliable than the Qwen models, which stay the default for text-heavy work."
# Z-Image reuses the FLUX.1-schnell autoencoder, hence the bare `ae` file name.
# Its text encoder is Qwen3-4B-Instruct-2507, not the Qwen3-VL used by
# Qwen-Image-2.1 -- and that encoder has no vision tower, so this model cannot
# edit images: supports_editing stays false.
diffusion_model = "z_image_turbo-Q4_K.gguf"
vae = "ae.safetensors"
text_encoder = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
port = 8113
supports_editing = false
default_size = "1024x1024"
# 16, not 32: the DiT patches at 2x2 over an 8x-downsampling VAE.
dimension_multiple = 16
max_pixels = 1048576
max_images_per_request = 1

[models.sampling]
steps = 8
cfg = 1.0
# euler_a is what sd-server picks for a model that is not Flux/SD3/Wan, per
# `sd-server --help`; the engine's own Z-Image example sets no method at all.
sample_method = "euler_a"
negative_prompt = ""

[[models]]
id = "moss-image"
description = "MOSS-Image SFT, 5B DiT at 20 steps CFG 3. Apache-2.0 weights. Strong prompt adherence and coherent typography; Qwen3.5 9B text encoder means slow prompt encoding on this card. Denoiser is unsloth's Q8_0: measured faster than Q5_K_M on this card (~160 s vs ~220 s at 1024x1024) and better, needing ~6.1 GB of VRAM. Text encoder Q4_K_M follows the upstream docs example."
# MOSS uses the FLUX.2 VAE (mirrored ungated by Comfy-Org; BFL is gated) and
# Qwen3.5-9B, whose vocabulary is not embedded in sd.cpp -- hence the external
# tokenizer.json (20 MB, OpenMOSS-Team/MOSS-Image-Base).
diffusion_model = "MOSS-Image-SFT-Q8_0.gguf"
vae = "flux2-vae.safetensors"
text_encoder = "Qwen3.5-9B-Q4_K_M.gguf"
tokenizer = "tokenizer.json"
port = 8114
# MOSS is absent from the upstream edit.md model table and from
# sd_version_supports_ref_image_conditioning: reference images would be ignored.
supports_editing = false
# Advertise structured-layout support in /v1/models. The layout JSON document
# (summary.caption + items with yxyx bboxes in abs_centralized coordinates) is
# sent as the ordinary `prompt` string; the weights parse it and imagegen only
# relays it. Both Base and SFT document this; generation size must match the
# canvas the coordinates were computed for.
layout = "moss"
default_size = "1024x1024"
# 16 per upstream docs/moss_image.md ("dimensions divisible by 16").
dimension_multiple = 16
max_pixels = 1048576
max_images_per_request = 1

[models.sampling]
steps = 20
cfg = 3.0
sample_method = "euler"
scheduler = "discrete"
# Upstream time shift of 5; the engine's default for MOSS, stated explicitly
# so a pin bump cannot silently change the schedule.
flow_shift = 5.0
negative_prompt = ""

[[models]]
id = "flux-3-image-klein"
description = "FLUX.3 Image Klein, 4B distilled DiT at 16 steps CFG 1. Fastest model here at 1024x1024. Edits supported (flux2 preset: refs reach the DiT via the VAE, no vision tower). flux-kommunity-license weights, not Apache-2.0."
# FLUX.3 reuses the FLUX.2 VAE (shared with MOSS-Image) and Qwen3-VL-4B as the
# text encoder. The 4B encoder needs no mmproj: the flux2 edit preset is VLM=No.
diffusion_model = "flux-3-image-klein-Q5_K_M.gguf"
vae = "flux2-vae.safetensors"
text_encoder = "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
port = 8115
supports_editing = true
default_size = "1024x1024"
# 16 verified against the pinned engine: 1008x1008 generates and returns
# exactly 1008x1008, while 1008 is not a multiple of 32.
dimension_multiple = 16
max_pixels = 1048576
max_images_per_request = 1

[models.sampling]
steps = 16
cfg = 1.0
sample_method = "euler"
scheduler = "discrete"
# Upstream time shift of 6.93 (docs/flux3.md); also the engine's built-in
# default for VERSION_FLUX3, stated explicitly for the same reason as MOSS.
flow_shift = 6.93
negative_prompt = ""
