[project]
name = "imagegen"
version = "0.1.0"
description = "OpenAI-compatible image generation service backed by stable-diffusion.cpp and Qwen-Image-2.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.scripts]
imagegen = "imagegen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
